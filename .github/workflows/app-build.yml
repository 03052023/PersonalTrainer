# Build manual do app do iPhone em runner macOS padrão (ARCHITECTURE ADR 008). Só o iPhone: o app do Watch
# fica fora do build até o M3 (SPEC §7.18 L6); o projeto gerado não pode embuti-lo e o .app não pode ter Watch/.
# Sem segredos e sem credenciais Apple: o IPA sai sem assinatura Apple e é reassinado localmente.
# Antes de executar, confirmar o orçamento de US$ 0 do GitHub Actions (WINDOWS_SETUP.md).
# Também roda em push para branches `ci/**`: o código do app é escrito sem compilador (AGENTS R11), e o agente
# precisa do veredito do Xcode sem depender de um clique. Os erros saem como anotações (legíveis sem login).
#
# Política de custo (T11.1). Com o repositório privado, o minuto de macOS custa US$ 0,062 e o plano Free
# cobre só ~200 min de macOS por mês; antes desta política o App build gastava ~2.350 min/mês (79 runs em
# 11,7 dias, ~12 min cada, dos quais ~3,5 min eram o build Release de dispositivo que gera o IPA).
#   1. Push para `ci/**` que muda só documentação (`**/*.md`, `docs/**`, `ideia.txt`) não dispara o workflow.
#      Push sem nenhum arquivo mudado (commit vazio) também não: o GitHub não roda workflow com filtro de
#      caminho quando o diff está vazio (verificado em 05/10/2026: commit vazio com `[ipa]` não criou run).
#      Para gerar o IPA de um código que já passou sem mudar arquivo, use workflow_dispatch.
#   2. Todo run compila e roda os testes no simulador e confere o manifesto de privacidade e o Info.plist do
#      app do simulador (SPEC §7.18 L1, L6, L7). O IPA ("Build unsigned device IPA" + "Keep package for
#      local re-signing") só sai quando o run é manual (workflow_dispatch), ou o branch termina em `-final`
#      (ex.: `ci/v9-final`), ou a mensagem do commit da ponta do push contém `[ipa]` (o commit precisa mudar
#      algum arquivo fora da documentação; ver item 1).
#   3. Resultados de teste ficam 1 dia (só servem para diagnosticar o run); o IPA fica 3 dias.
#   4. Push novo no mesmo branch cancela o run anterior (concurrency abaixo).
name: App build (manual)
on:
  workflow_dispatch:
  push:
    branches: ['ci/**']
    # Política de custo, item 1. Com `branches` e `paths-ignore` juntos, o run só acontece quando os dois
    # filtros aceitam o push (docs do GitHub, "on.push.<branches|paths>").
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'ideia.txt'
permissions:
  contents: read
concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    # `shell: bash` explícito ativa -o pipefail (o padrão implícito é só `bash -e`).
    shell: bash
jobs:
  build:
    # macos-26 = arm64, macOS 26.6, Xcode 26.6 default (SDK iOS/watchOS 26.5). Label explícito:
    # `macos-latest` muda de versão sem aviso. Nunca usar -large/-xlarge (sempre cobrados).
    runs-on: macos-26
    timeout-minutes: 40
    env:
      # Fixa o Xcode mesmo quando a imagem trocar o default (actions/runner-images macos-26-Readme).
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # Política de custo, item 2 (vira o texto 'true' ou 'false'). `head_commit` só existe em push; em
      # workflow_dispatch ele é nulo e contains() dá false, mas o primeiro termo já cobre esse evento.
      PACKAGE_IPA: ${{ github.event_name == 'workflow_dispatch' || endsWith(github.ref_name, '-final') || contains(github.event.head_commit.message, '[ipa]') }}
    steps:
      - uses: actions/checkout@v5
      - name: Check TrainerCore boundaries
        run: bash Scripts/check-boundaries.sh
      - name: 'Check L1: no network code'
        # SPEC §7.18 L1, CA11-1: o app não tem código de rede nem SDK de terceiros. Barato, roda antes do XcodeGen.
        run: |
          failures=0
          annotate() {
            local body
            body="$(printf '%s' "$2" | sed -e 's/%/%25/g' -e 's/\r//g' | awk 'BEGIN{ORS="%0A"} {print}')"
            echo "::error title=$1::$body"
          }

          # 1. Nenhuma API de rede nos fontes do app e do TrainerCore (testes incluídos).
          status=0
          matches="$(grep -rnE 'URLSession|NWConnection|NSURLConnection|import Network' PersonalTrainer Packages --include='*.swift')" || status=$?
          case "$status" in
            0) annotate "L1 código de rede" "$(printf 'API de rede nos fontes (SPEC L1):\n%s' "$(printf '%s\n' "$matches" | head -20)")"; failures=$((failures + 1)) ;;
            1) echo "[OK] nenhum URLSession, NWConnection, NSURLConnection nem import Network" ;;
            *) echo "::error title=L1 código de rede::grep saiu com $status"; exit 2 ;;
          esac

          # 2. Nenhum pacote remoto no project.yml (só `path:` local dentro de `packages:`).
          remote="$(sed -n '/^packages:/,/^[^[:space:]#]/p' project.yml | grep -E '^[[:space:]]+(url|github|from|exactVersion|minVersion|maxVersion|majorVersion|minorVersion|version|branch|revision):' || true)"
          if [ -n "$remote" ]; then
            annotate "L1 pacote remoto" "$(printf 'project.yml tem pacote remoto (SPEC L1):\n%s' "$remote")"
            failures=$((failures + 1))
          else
            echo "[OK] project.yml sem pacote remoto"
          fi

          # 3. Nenhuma dependência declarada nos Package.swift locais (o TrainerCore só usa Foundation).
          status=0
          deps="$(grep -rnE '\.package\(' Packages --include='Package.swift')" || status=$?
          case "$status" in
            0) annotate "L1 dependência de pacote" "$(printf 'Package.swift com dependência (SPEC L1):\n%s' "$deps")"; failures=$((failures + 1)) ;;
            1) echo "[OK] Package.swift sem dependências" ;;
            *) echo "::error title=L1 dependência de pacote::grep saiu com $status"; exit 2 ;;
          esac

          test "$failures" -eq 0
      - name: Report IPA policy
        # Anotação pública: quem lê o run sem login sabe por que não há artefato de IPA.
        run: |
          echo "PACKAGE_IPA=$PACKAGE_IPA (evento $GITHUB_EVENT_NAME, branch $GITHUB_REF_NAME)"
          if [ "$PACKAGE_IPA" != "true" ]; then
            echo "::notice title=IPA não empacotado::Só testes neste run. O IPA sai em workflow_dispatch, em branch terminado em -final ou com [ipa] na mensagem do commit da ponta."
          fi
      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install xcodegen
          xcodegen --version
      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          test -d PersonalTrainer.xcodeproj
          test -f PersonalTrainer/Support/Info.plist
          test -f PersonalTrainerWatch/Support/Info.plist
          # SPEC §7.18 L6: o app do iPhone não embute o app do Watch até o M3. O target PersonalTrainerWatch
          # continua no projeto (o Info.plist dele é gerado, test -f acima), mas sem a dependência o XcodeGen
          # não cria a fase "Embed Watch Content". Falhar aqui em segundos, não depois de 10 min de build.
          pbxproj=PersonalTrainer.xcodeproj/project.pbxproj
          if grep -q 'Embed Watch Content' "$pbxproj"; then
            echo "::error::O projeto gerado por XcodeGen $(xcodegen --version) tem a fase 'Embed Watch Content': o app do iPhone não pode embutir o Watch (SPEC L6; project.yml sem a dependência PersonalTrainerWatch)"
            grep -n -B 2 -A 8 'Embed Watch Content' "$pbxproj" || true
            exit 1
          fi
          # SPEC §7.18 L1: o manifesto de privacidade deve estar em "Copy Bundle Resources". Falha rápida aqui, em
          # vez de depois dos testes; o passo "Check privacy manifest and Info.plist" confere o .app de verdade.
          if ! grep -q 'PrivacyInfo.xcprivacy in Resources' "$pbxproj"; then
            found="$(grep -n 'PrivacyInfo' "$pbxproj" | head -5 | tr '\n' ' ' || true)"
            echo "::error title=L1 manifesto fora de Resources::PrivacyInfo.xcprivacy não está na fase Copy Bundle Resources do project.pbxproj. Linhas com PrivacyInfo: ${found:-nenhuma}"
            exit 1
          fi
      - name: Select iPhone simulator
        id: simulator
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          listing = subprocess.run(
              ["xcrun", "simctl", "list", "-j", "devices", "available"],
              check=True, capture_output=True, text=True,
          ).stdout
          devices = json.loads(listing)["devices"]
          marker = ".SimRuntime.iOS-"
          candidates = []
          for runtime, entries in devices.items():
              if marker not in runtime:
                  continue
              version = tuple(int(part) for part in runtime.split(marker, 1)[1].split("-") if part.isdigit())
              for device in entries:
                  name = device.get("name", "")
                  if not device.get("isAvailable") or not name.startswith("iPhone"):
                      continue
                  is_base_model = not any(token in name for token in ("Pro", "Max", "Plus", "Air", "mini", "SE"))
                  candidates.append((version, is_base_model, name, device["udid"]))
          if not candidates:
              print("::error::Nenhum simulador iPhone disponível no runner")
              print(listing)
              sys.exit(1)
          # Runtime iOS mais novo primeiro; entre eles, prefere o modelo base.
          candidates.sort(key=lambda item: (item[0], item[1], item[2]), reverse=True)
          version, _, name, udid = candidates[0]
          print(f"Simulador escolhido: {name} ({udid}), iOS {'.'.join(str(n) for n in version)}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"udid={udid}\nname={name}\n")
          PY
      - name: Test on simulator
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          mkdir -p build/app
          if command -v xcbeautify >/dev/null 2>&1; then
            pretty=(xcbeautify --renderer github-actions)
          else
            pretty=(cat)
          fi
          # `tee` guarda o log bruto: em falha, o passo seguinte publica log + .xcresult para diagnóstico.
          xcodebuild test -project PersonalTrainer.xcodeproj -scheme PersonalTrainer -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath build/app/DerivedData \
            -resultBundlePath build/app/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO 2>&1 | tee build/app/xcodebuild-test.log | "${pretty[@]}"
      - name: Keep test results for diagnosis
        # Roda também quando o teste falha (o código é escrito sem compilador local): evita gastar outro
        # run de macOS só para ler o erro. `!cancelled()` em vez de `always()` respeita o cancel-in-progress.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: PersonalTrainer-test-results
          path: |
            build/app/TestResults.xcresult
            build/app/xcodebuild-test.log
          if-no-files-found: ignore
          # Política de custo, item 3: só diagnostica este run; o próximo push gera outro.
          retention-days: 1
      - name: 'Check privacy manifest and Info.plist (L1, L6, L7)'
        # CA11-2 e CA11-6 sobre o app do simulador (Debug), só com os testes verdes (success() implícito).
        # O mesmo vale para o IPA no Scripts/build-app.sh. Cada falha vira uma anotação pública.
        run: |
          app=build/app/DerivedData/Build/Products/Debug-iphonesimulator/PersonalTrainer.app
          pb=/usr/libexec/PlistBuddy
          failures=0
          fail() {
            echo "::error title=$1::$2"
            failures=$((failures + 1))
          }
          # Um valor ausente vira texto vazio; `Print` de booleano devolve true/false.
          plist_get() { "$pb" -c "Print :$2" "$1" 2>/dev/null || true; }

          if [ ! -d "$app" ]; then
            echo "::error title=App do simulador ausente::$app não existe"
            exit 1
          fi

          # --- Manifesto de privacidade (L1) ---
          manifest="$app/PrivacyInfo.xcprivacy"
          if [ ! -f "$manifest" ]; then
            fail "L1 manifesto ausente" "PrivacyInfo.xcprivacy não está na raiz do .app (fase Copy Bundle Resources do XcodeGen). Raiz: $(ls "$app" | tr '\n' ' ')"
          elif ! plutil -lint "$manifest"; then
            fail "L1 manifesto inválido" "plutil -lint rejeitou o PrivacyInfo.xcprivacy"
          else
            tracking="$(plist_get "$manifest" NSPrivacyTracking)"
            if [ "$tracking" != "false" ]; then
              fail "L1 rastreamento" "NSPrivacyTracking = '$tracking' (esperado false)"
            fi
            for key in NSPrivacyTrackingDomains NSPrivacyCollectedDataTypes; do
              if ! "$pb" -c "Print :$key" "$manifest" >/dev/null 2>&1; then
                fail "L1 $key" "$key ausente no manifesto (esperado um array vazio)"
              elif "$pb" -c "Print :$key:0" "$manifest" >/dev/null 2>&1; then
                fail "L1 $key" "$key tem itens (esperado um array vazio)"
              fi
            done
            # Motivo CA92.1 (dados só do próprio app) na categoria UserDefaults.
            found_reason=false
            i=0
            while category="$("$pb" -c "Print :NSPrivacyAccessedAPITypes:$i:NSPrivacyAccessedAPIType" "$manifest" 2>/dev/null)"; do
              if [ "$category" = "NSPrivacyAccessedAPICategoryUserDefaults" ]; then
                j=0
                while reason="$("$pb" -c "Print :NSPrivacyAccessedAPITypes:$i:NSPrivacyAccessedAPITypeReasons:$j" "$manifest" 2>/dev/null)"; do
                  if [ "$reason" = "CA92.1" ]; then found_reason=true; fi
                  j=$((j + 1))
                done
              fi
              i=$((i + 1))
            done
            if [ "$found_reason" != "true" ]; then
              fail "L1 UserDefaults" "O manifesto não declara NSPrivacyAccessedAPICategoryUserDefaults com o motivo CA92.1"
            fi
          fi

          # --- Info.plist do app (L7 e criptografia) ---
          plist="$app/Info.plist"
          version="$(plist_get "$plist" CFBundleShortVersionString)"
          if [ "$version" != "1.0.0" ]; then
            fail "L7 versão" "CFBundleShortVersionString = '$version' (esperado 1.0.0)"
          fi
          encryption="$(plist_get "$plist" ITSAppUsesNonExemptEncryption)"
          if [ "$encryption" != "false" ]; then
            fail "L1 criptografia" "ITSAppUsesNonExemptEncryption = '$encryption' (esperado false)"
          fi

          # --- Sem o app do Watch (L6) ---
          if [ -e "$app/Watch" ]; then
            fail "L6 Watch no app" "O .app do simulador tem a pasta Watch/: o iPhone não pode embutir o relógio até o M3"
          fi

          if [ "$failures" -ne 0 ]; then
            exit 1
          fi
          echo "Manifesto, versão $version, criptografia $encryption e ausência de Watch/ conferidos em $app"
      - name: Build unsigned device IPA
        # Política de custo, item 2. Um `if:` sem função de status mantém o success() implícito.
        if: ${{ env.PACKAGE_IPA == 'true' }}
        run: bash Scripts/build-app.sh 2>&1 | tee build/app/build-app.log
      - name: Report failures as annotations
        # O log completo do job exige login; anotações da check-run são públicas. Mesmo formato do Core tests.
        if: failure()
        run: |
          : > /tmp/errors.txt
          for log in build/app/xcodebuild-test.log build/app/build-app.log; do
            test -f "$log" || continue
            grep -E "error:|: error |Test Case .* failed|XCTAssert|failed \(|Testing failed|TEST FAILED|BUILD FAILED|Fatal error|Crash:" "$log" \
              | sed -E "s#$GITHUB_WORKSPACE/##g" >> /tmp/errors.txt || true
          done
          awk '!seen[$0]++' /tmp/errors.txt | head -80 > /tmp/errors-unique.txt
          test -s /tmp/errors-unique.txt || { echo "::error title=app build::falhou sem linha de erro reconhecível (ver artefato PersonalTrainer-test-results)"; exit 0; }
          split -l 8 /tmp/errors-unique.txt /tmp/err-chunk-
          n=0
          for chunk in /tmp/err-chunk-*; do [ -f "$chunk" ] || continue; n=$((n+1))
            msg=$(sed -e 's/%/%25/g' -e 's/\r//g' "$chunk" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=app build (parte $n)::$msg"; done
      - name: Keep package for local re-signing
        if: ${{ env.PACKAGE_IPA == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: PersonalTrainer-for-resigning
          # O nome do artefato e do IPA não mudam (o guia de instalação cita): só o app do iPhone, sem Watch/.
          path: |
            build/app/PersonalTrainer-iphone-only-for-resigning.ipa
            build/app/SHA256.txt
            build/app/SOURCE_COMMIT.txt
            build/app/XCODE_VERSION.txt
          if-no-files-found: error
          retention-days: 3
