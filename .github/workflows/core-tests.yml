# Testes do pacote TrainerCore (Swift puro) em Linux + verificação de fronteiras (AGENTS.md R1–R3).
# Roda só quando o pacote, os JSON de seed (lidos por SeedBundleTests via #filePath), o script de
# fronteira ou este workflow mudam.
name: Core tests
on:
  push:
    paths:
      - "Packages/**"
      - "PersonalTrainer/Resources/Seed/**"
      - "Scripts/check-boundaries.sh"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "Packages/**"
      - "PersonalTrainer/Resources/Seed/**"
      - "Scripts/check-boundaries.sh"
      - ".github/workflows/core-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    # Package.swift usa swift-tools-version 6.0 e swiftLanguageMode(.v6): qualquer toolchain ≥ 6.0.
    # swift:6.3 (6.3.x sobre Ubuntu 24.04) casa com o Swift 6.3 embutido no Xcode 26.6 usado em
    # app-build.yml, evitando divergência entre o teste Linux e o build macOS. Não usar `latest`.
    container: swift:6.3
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Check TrainerCore boundaries
        run: bash Scripts/check-boundaries.sh
      - name: Swift version
        run: swift --version
      - name: Test TrainerCore
        shell: bash
        run: |
          set -o pipefail
          swift test --package-path Packages/TrainerCore 2>&1 | tee /tmp/swift-test.log
      # O log completo do Actions exige login no GitHub; anotações são públicas. Em falha, publica
      # as linhas de erro do compilador e dos testes como anotações (lidas pelo agente sem credenciais).
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: |
          test -f /tmp/swift-test.log || exit 0
          grep -E "error:|recorded an issue|Expectation failed|failed after|Fatal error|Test run with" /tmp/swift-test.log \
            | sed -E "s#$GITHUB_WORKSPACE/##g" | awk '!seen[$0]++' | head -64 > /tmp/errors.txt || true
          total=$(wc -l < /tmp/errors.txt)
          echo "linhas de erro: $total"
          split -l 8 /tmp/errors.txt /tmp/err-chunk-
          n=0
          for chunk in /tmp/err-chunk-*; do
            [ -f "$chunk" ] || continue
            n=$((n+1))
            msg=$(sed -e 's/%/%25/g' -e 's/\r//g' "$chunk" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=swift test (parte $n)::$msg"
          done
