# Testes do pacote TrainerCore (Swift puro) em Linux + verificação de fronteiras (AGENTS.md R1–R3).
# Roda só quando o pacote, os JSON de seed (lidos por SeedBundleTests via #filePath), o script de
# fronteira ou este workflow mudam.
name: Core tests
on:
  push:
    paths:
      - "Packages/**"
      - "PersonalTrainer/Resources/Seed/**"
      - "Scripts/check-boundaries.sh"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "Packages/**"
      - "PersonalTrainer/Resources/Seed/**"
      - "Scripts/check-boundaries.sh"
      - ".github/workflows/core-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    # Package.swift usa swift-tools-version 6.0 e swiftLanguageMode(.v6): qualquer toolchain ≥ 6.0.
    # swift:6.3 (6.3.x sobre Ubuntu 24.04) casa com o Swift 6.3 embutido no Xcode 26.6 usado em
    # app-build.yml, evitando divergência entre o teste Linux e o build macOS. Não usar `latest`.
    container: swift:6.3
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Check TrainerCore boundaries
        run: bash Scripts/check-boundaries.sh
      - name: Swift version
        run: swift --version
      - name: Test TrainerCore
        run: swift test --package-path Packages/TrainerCore
