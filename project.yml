# project.yml — fonte única do PersonalTrainer.xcodeproj (T0.1).
#
# O .xcodeproj NÃO é versionado: `xcodegen generate` o recria no runner macOS (ver
# .github/workflows/app-build.yml). Como o projeto é regenerado a partir do disco em todo
# build, qualquer arquivo novo em PersonalTrainer/, PersonalTrainerWatch/ ou
# PersonalTrainerTests/ entra no target certo sem editar project.pbxproj — o mesmo efeito
# das synchronized folders previstas em ARCHITECTURE §2, sem conflito de merge entre agentes.
#
# Chaves conforme XcodeGen Docs/ProjectSpec.md (Options, Target, Target Source, Dependency,
# Swift Package, Plist, Target Scheme). Os Info.plist são gerados em */Support/Info.plist e
# ficam fora do Git; os .entitlements são versionados e referenciados por CODE_SIGN_ENTITLEMENTS.
name: PersonalTrainer

options:
  bundleIdPrefix: com.personaltrainer
  xcodeVersion: "26.0"
  developmentLanguage: pt-BR
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"

configs:
  Debug: debug
  Release: release

# Swift 6 language mode com strict concurrency em todos os targets (ARCHITECTURE §2).
# DEVELOPMENT_TEAM vazio: o build no CI é sem assinatura; a reassinatura acontece localmente.
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    # Versão pública do lançamento (SPEC §7.18 L7). O CURRENT_PROJECT_VERSION continua "1": o número do
    # build da loja é gerado no envio (T11.7).
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

packages:
  TrainerCore:
    path: Packages/TrainerCore

targets:
  PersonalTrainer:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      # Resources/PrivacyInfo.xcprivacy (SPEC §7.18 L1) entra em "Copy Bundle Resources" por não ser código;
      # o app-build.yml confere o arquivo na raiz do .app. Se um XcodeGen novo deixar de copiá-lo, trocar
      # por uma entrada própria (`path:` do arquivo, `buildPhase: resources`) e excluí-lo daqui.
      - path: PersonalTrainer
        excludes:
          # Info.plist gerado e .entitlements não entram em nenhuma build phase.
          - "Support/**"
    dependencies:
      # O Watch fica fora do build do iPhone até o M3 (SPEC §7.18 L6): o target PersonalTrainerWatch
      # continua neste arquivo, mas sem a dependência o XcodeGen não cria a fase "Embed Watch Content".
      # Para devolvê-lo no M3: `- target: PersonalTrainerWatch` aqui (um app com platform watchOS vira
      # a fase de embutir em …/Watch; não usar supportedDestinations).
      - package: TrainerCore
        product: TrainerCore
    info:
      path: PersonalTrainer/Support/Info.plist
      properties:
        CFBundleDevelopmentRegion: pt-BR
        CFBundleDisplayName: Magister
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        # Abertura (SPEC RF-50; docs/V23-UI-CONTRACT.md §4.2, ponto 1): a tela de lançamento repete o
        # ícone — o azul do meio do degradê dele (LaunchBackground.colorset) e a flor Brisa com o halo
        # (LaunchFlower.imageset, gerados por docs/design/v23-animation/render-launch-assets.ps1).
        # UIStatusBarHidden esconde a barra já na tela de lançamento; a `LaunchOverlay` a mostra de
        # volta em `t = 0,45 s` (`.statusBar(hidden:)`).
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchFlower
        UIStatusBarHidden: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # HealthKit (ARCHITECTURE §8, AR-6): textos da permissão, exatos como o contrato da 2.5 (§6.3).
        NSHealthShareUsageDescription: "O Magister lê do app Saúde seus treinos, frequência cardíaca, VO2máx, variabilidade da frequência cardíaca, frequência cardíaca em repouso, sono, passos e data de nascimento e sexo (opcionais) para mostrar o resumo de cada sessão, seus minutos de aeróbico e sua recuperação. Ele usa esses dados apenas no aparelho."
        NSHealthUpdateUsageDescription: "O Magister grava no app Saúde cada sessão concluída: as de força como treino de força e as de aeróbico como treino aeróbico."
        # O app só usa a criptografia do próprio iOS (HTTPS não é usado: SPEC §7.18 L1). Sem esta chave,
        # o App Store Connect pergunta sobre exportação de criptografia a cada envio.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personaltrainer.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PersonalTrainer/Support/PersonalTrainer.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
    scheme:
      testTargets:
        - PersonalTrainerTests
      gatherCoverageData: true

  PersonalTrainerWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: PersonalTrainerWatch
        excludes:
          - "Support/**"
    dependencies:
      - package: TrainerCore
        product: TrainerCore
    info:
      path: PersonalTrainerWatch/Support/Info.plist
      properties:
        CFBundleDevelopmentRegion: pt-BR
        CFBundleDisplayName: Magister
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Companion de target único (watchOS 7+). Nunca adicionar NSExtension aqui: o instalador
        # passaria a exigir o app em PlugIns/ ("Foundation extension … PlugIns directory").
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.personaltrainer.app
        WKRunsIndependentlyOfCompanionApp: false
        # Sessão de treino ativa em segundo plano (ARCHITECTURE §9, AR-7; CA0-4).
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: "O Magister lê sua frequência cardíaca durante o treino para mostrá-la ao vivo e no resumo da sessão."
        NSHealthUpdateUsageDescription: "O Magister grava a sessão de treino em andamento como um treino no app Saúde."
    settings:
      base:
        # Descendente do bundle ID do app iOS, separado por ponto (exigência do instalador).
        PRODUCT_BUNDLE_IDENTIFIER: com.personaltrainer.app.watchkitapp
        CODE_SIGN_ENTITLEMENTS: PersonalTrainerWatch/Support/PersonalTrainerWatch.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete

  PersonalTrainerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PersonalTrainerTests
    dependencies:
      # TEST_HOST/BUNDLE_LOADER são definidos automaticamente pelo XcodeGen a partir desta dependência.
      - target: PersonalTrainer
      - package: TrainerCore
        product: TrainerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personaltrainer.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
